openapi: 3.1.0
info:
  title: Book Calendar API
  description: >
    Google Calendar, Contacts, and Gmail APIs for use with Custom GPT actions.
    All endpoints require server-side OAuth2 credentials (set via Vercel env vars).
  version: 1.0.0
servers:
  - url: https://book-calendar-vercel.vercel.app/api
    description: Production (Vercel)

paths:
  /calendar-list:
    get:
      operationId: listCalendars
      summary: List all Google Calendars
      description: Returns all calendars available to the authenticated user.
      responses:
        "200":
          description: List of calendars
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  calendars:
                    type: array
                    items:
                      $ref: "#/components/schemas/Calendar"
        "500":
          $ref: "#/components/responses/Error"

  /calendar-events:
    get:
      operationId: listCalendarEvents
      summary: List events from a Google Calendar
      description: Returns events from a specified calendar within a date range.
      parameters:
        - name: calendarId
          in: query
          description: Calendar ID (default "primary")
          schema:
            type: string
            default: primary
        - name: timeMin
          in: query
          description: Start of time range in ISO 8601 format (default now)
          schema:
            type: string
            format: date-time
        - name: timeMax
          in: query
          description: End of time range in ISO 8601 format (default 30 days from now)
          schema:
            type: string
            format: date-time
        - name: maxResults
          in: query
          description: Max number of events to return (default 50)
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of calendar events
          content:
            application/json:
              schema:
                type: object
                properties:
                  calendarId:
                    type: string
                  timeMin:
                    type: string
                  timeMax:
                    type: string
                  count:
                    type: integer
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/CalendarEvent"
        "500":
          $ref: "#/components/responses/Error"

  /contacts:
    get:
      operationId: listContacts
      summary: List or search Google Contacts
      description: >
        Returns contacts from Google Contacts (People API).
        Provide a `query` to search, or omit it to list all contacts (paginated).
      parameters:
        - name: query
          in: query
          description: Free-text search query (name, email, etc.)
          schema:
            type: string
        - name: pageSize
          in: query
          description: Max contacts to return (default 100, max 1000)
          schema:
            type: integer
            default: 100
        - name: pageToken
          in: query
          description: Token for next page of results
          schema:
            type: string
      responses:
        "200":
          description: List of contacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  totalCount:
                    type: integer
                    nullable: true
                  nextPageToken:
                    type: string
                    nullable: true
                  contacts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Contact"
        "500":
          $ref: "#/components/responses/Error"

  /gmail:
    get:
      operationId: listGmailMessages
      summary: List or search Gmail messages
      description: >
        Returns Gmail messages for the authenticated user.
        Use `q` for Gmail search syntax (e.g. `is:unread`, `from:someone@example.com`).
        Set `full=true` to include the plain-text and HTML body of each message.
      parameters:
        - name: q
          in: query
          description: Gmail search query (e.g. "is:unread", "from:boss@company.com")
          schema:
            type: string
        - name: maxResults
          in: query
          description: Max messages to return (default 20, max 500)
          schema:
            type: integer
            default: 20
        - name: pageToken
          in: query
          description: Token for next page of results
          schema:
            type: string
        - name: labelIds
          in: query
          description: Comma-separated Gmail label IDs to filter by (e.g. "INBOX,UNREAD")
          schema:
            type: string
        - name: full
          in: query
          description: Set to "true" to include full bodyText and bodyHtml
          schema:
            type: string
            enum: ["true", "false"]
            default: "false"
      responses:
        "200":
          description: List of Gmail messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  resultSizeEstimate:
                    type: integer
                  nextPageToken:
                    type: string
                    nullable: true
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/GmailMessage"
        "500":
          $ref: "#/components/responses/Error"

components:
  schemas:
    Calendar:
      type: object
      properties:
        id:
          type: string
        summary:
          type: string
        description:
          type: string
          nullable: true
        timeZone:
          type: string
          nullable: true
        colorId:
          type: string
          nullable: true
        backgroundColor:
          type: string
          nullable: true
        foregroundColor:
          type: string
          nullable: true
        primary:
          type: boolean
        accessRole:
          type: string
          nullable: true

    CalendarEvent:
      type: object
      properties:
        id:
          type: string
        summary:
          type: string
        description:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        start:
          type: string
          nullable: true
        end:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        htmlLink:
          type: string
          nullable: true
        organizer:
          type: object
          nullable: true
          properties:
            email:
              type: string
            displayName:
              type: string
              nullable: true
        attendees:
          type: array
          items:
            type: object
            properties:
              email:
                type: string
              displayName:
                type: string
                nullable: true
              responseStatus:
                type: string
                nullable: true

    Contact:
      type: object
      properties:
        resourceName:
          type: string
        displayName:
          type: string
          nullable: true
        givenName:
          type: string
          nullable: true
        familyName:
          type: string
          nullable: true
        emails:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
              type:
                type: string
                nullable: true
        phones:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
              type:
                type: string
                nullable: true
        organizations:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                nullable: true
              title:
                type: string
                nullable: true
        photoUrl:
          type: string
          nullable: true

    EmailAddress:
      type: object
      properties:
        name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true

    GmailMessage:
      type: object
      properties:
        id:
          type: string
        threadId:
          type: string
        labelIds:
          type: array
          items:
            type: string
        snippet:
          type: string
        subject:
          type: string
          nullable: true
        from:
          $ref: "#/components/schemas/EmailAddress"
        to:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        cc:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        date:
          type: string
          nullable: true
        isUnread:
          type: boolean
        bodyText:
          type: string
          nullable: true
          description: Plain-text body (only present when full=true)
        bodyHtml:
          type: string
          nullable: true
          description: HTML body (only present when full=true)

  responses:
    Error:
      description: Server error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              detail:
                type: string
